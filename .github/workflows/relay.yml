# Deploy the NOTAM relay (relay/notam-relay.mjs) to Cloudflare Workers.
#
# Runs when the relay's code changes on main, or by hand (Actions -> this
# workflow -> Run workflow). The relay's three secrets are pushed to Cloudflare
# on every deploy, so changing one in GitHub and re-running this is all it
# takes to rotate it.
#
# NEEDS THESE REPOSITORY SECRETS (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   an API token made from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  the account ID shown on the Cloudflare dashboard
#   AUTOROUTER_USER        the autorouter account's email
#   AUTOROUTER_PASS        its password (API access must be enabled on the account)
#   NOTAM_RELAY_KEY        any long random string; the planner sends it with each request
#
# If the Cloudflare secrets are missing the job FAILS rather than skipping, so a
# relay that was never deployed is never mistaken for one that was.
name: Deploy NOTAM relay

on:
  push:
    branches: [main]
    paths: ['relay/**', '.github/workflows/relay.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notam-relay
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Refuse to run without the secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AR_USER: ${{ secrets.AUTOROUTER_USER }}
          AR_PASS: ${{ secrets.AUTOROUTER_PASS }}
          RELAY_KEY: ${{ secrets.NOTAM_RELAY_KEY }}
        run: |
          missing=""
          [ -n "$CF_TOKEN" ]   || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CF_ACCOUNT" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$AR_USER" ]    || missing="$missing AUTOROUTER_USER"
          [ -n "$AR_PASS" ]    || missing="$missing AUTOROUTER_PASS"
          [ -n "$RELAY_KEY" ]  || missing="$missing NOTAM_RELAY_KEY"
          if [ -n "$missing" ]; then echo "Missing repository secret(s):$missing"; exit 1; fi
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: relay
          command: deploy
          secrets: |
            AUTOROUTER_USER
            AUTOROUTER_PASS
            RELAY_KEY
        env:
          AUTOROUTER_USER: ${{ secrets.AUTOROUTER_USER }}
          AUTOROUTER_PASS: ${{ secrets.AUTOROUTER_PASS }}
          RELAY_KEY: ${{ secrets.NOTAM_RELAY_KEY }}
